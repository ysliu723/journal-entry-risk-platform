services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: je_risk
      POSTGRES_PASSWORD: je_risk
      POSTGRES_DB: je_risk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U je_risk -d je_risk"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://je_risk:je_risk@db:5432/je_risk
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
