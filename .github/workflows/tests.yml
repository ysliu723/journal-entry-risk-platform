name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # A throwaway PostgreSQL for the database and API tests.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: je_risk
          POSTGRES_PASSWORD: je_risk
          POSTGRES_DB: je_risk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U je_risk -d je_risk_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://je_risk:je_risk@localhost:5432/je_risk_test
          REQUIRE_DATABASE: "1"
        run: pytest
